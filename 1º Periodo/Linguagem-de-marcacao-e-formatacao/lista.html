<!DOCTYPE html>
<html lang="pt-BR">

<!--Estrutura de itens-->

<h4>Uma Lista Não Ordenada:</h4>
<ul>
    <li>Café</li>
    <li>Chá</li>
    <li>Leite</li>
</ul>

<!--Conteudo diversificado-->

<ul>
    <li>Café</li>
    <ul>
        <li>Grãos Torrados</li>
        <li>Torrados e Moido</li>
    </ul>
</ul>

<!--Listas Ordenadas-->

<ol type="I">
    <li>Café</li>
    <li>Leite</li>
</ol>

<!--Tipos de Numeração-->
<!--Tipo 1-->
<ol type="A">
    <li>Café</li>
    <li>Leite</li>
</ol>

<!--Tipo 2-->
<ol type="I">
    <li>Café</li>
    <li>Leite</li>
</ol>
<!--Glossários-->
<h4>Lista de Denifição</h4>
<d1>
    <dt>Café</dt>
    <dd>Liq.quente</dd>
    <dt>Leite</dt>
    <dd>Bebida fria</dd>
</d1>
</html>
